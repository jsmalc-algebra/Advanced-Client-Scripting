<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Customer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            padding: 2rem 1rem;
        }
        .form-card {
            width: 100%;
        }
    </style>
    <script src="../js/page_scripts/edit_customer.js" type="module" defer></script>
    <script type="module" src="../js/page_scripts/navbar_functions.js" defer></script>
</head>
<body>



<div class="card form-card shadow-sm p-4">

    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary bg-gradient">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">DB managment app</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" href="customers.html" id="home-btn">Home</a>
                    </li>
                    <li class="nav-item">
                        <span id="user-display">User: Guest</span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-danger" id="logout-btn" type="button">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <h3 class="mb-4 text-center">Edit Customer</h3>
    <form id="editCustomerForm">
        <div class="mb-3">
            <label for="id" class="form-label">ID</label>
            <input type="text" class="form-control" id="id" disabled>
        </div>
        <div class="mb-3">
            <label for="firstName" class="form-label">Name</label>
            <input type="text" class="form-control" id="firstName" placeholder="First name" required>
        </div>
        <div class="mb-3">
            <label for="lastName" class="form-label">Last name</label>
            <input type="text" class="form-control" id="lastName" placeholder="Last name" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="text" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Telephone number</label>
            <input type="text" class="form-control" id="phone" placeholder="+385 012345 5678" required>
        </div>
        <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <select class="form-select" id="city" required>

            </select>
        </div>
        <button type="submit" class="btn btn-warning w-100 mb-2">Edit Customer</button>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
