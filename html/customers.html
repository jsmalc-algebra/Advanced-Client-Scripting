<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background-color: #f5f5f5;
      padding: 2rem 1rem;
    }
    .table-card {
      max-width: 960px;
      margin: 0 auto;
    }
    th.sortable {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th.sortable:hover {
      background-color: #eaeaea;
    }
    .sort-icon {
      font-size: 0.75rem;
      color: #999;
    }
  </style>
  <script type="module" src="../js/page_scripts/customers.js" defer></script>
</head>
<body>

  <div class="card table-card shadow-sm p-4">
    <h3 class="mb-4">Customers</h3>

    <div class="row g-2 align-items-end mb-4">
      <div class="col-12 col-md-4">
        <label for="searchInput" class="form-label small text-muted mb-1">Search</label>
        <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Name, email, city...">
      </div>

      <div class="col-6 col-md-3 ms-md-auto">
        <label for="pageSize" class="form-label small text-muted mb-1">Rows per page</label>
        <select id="pageSize" class="form-select form-select-sm">
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th scope="col" class="sortable" data-sort="name">Name <span class="sort-icon">↕</span></th>
            <th scope="col" class="sortable" data-sort="lastName">Last Name <span class="sort-icon">↕</span></th>
            <th scope="col" class="sortable" data-sort="email">Email <span class="sort-icon">↕</span></th>
            <th scope="col" class="sortable" data-sort="phone">Phone <span class="sort-icon">↕</span></th>
            <th scope="col" class="sortable" data-sort="city">City <span class="sort-icon">↕</span></th>
          </tr>
        </thead>
        <tbody id="table-body">

        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <nav aria-label="Users pagination">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item disabled">
            <span class="page-link">Prev</span>
          </li>
          <li class="page-item active">
            <span class="page-link">1</span>
          </li>
          <li class="page-item disabled">
            <span class="page-link">Next</span>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
