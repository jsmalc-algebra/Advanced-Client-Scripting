<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
        }
    </style>
</head>
<body>

<div class="card login-card shadow-sm p-4">
    <h3 class="mb-4 text-center">Sign In</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2">Login</button>

        <hr class="my-3">

        <div class="d-grid gap-2">
            <a href="register%20page.html" class="btn btn-outline-secondary w-100">Register</a>
            <button type="button" class="btn btn-outline-dark" id="anonymousBtn">Continue as Anonymous</button>
        </div>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        alert('Login attempted with: ' + email);
    });

    document.getElementById('registerBtn').addEventListener('click', function () {
        alert('Register clicked');
    });

    document.getElementById('anonymousBtn').addEventListener('click', function () {
        alert('Continuing as anonymous user');
    });
</script>
</body>
</html>
